<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinnitus Calmer</title>
    
    <!-- Load Roboto Font (Thin weight) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fff; /* White Background */
            color: #000; /* Black text/lines */
            font-family: 'Roboto', sans-serif;
            font-weight: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-weight: 100;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 3rem;
        }

        /* Power Button */
        #powerBtn {
            background-color: #fff;
            color: #000;
            border: 1px solid #000;
            border-radius: 50px;
            padding: 12px 30px;
            font-family: 'Roboto', sans-serif;
            font-weight: 100;
            font-size: 1.2rem;
            cursor: pointer;
            margin-bottom: 3rem;
            transition: all 0.3s ease;
        }

        #powerBtn:hover, #powerBtn.active {
            background-color: #000;
            color: #fff;
        }

        /* Sliders Container */
        .mixer {
            width: 70vmin;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            opacity: 0.3; /* Dimmed until turned on */
            pointer-events: none; /* Disabled until turned on */
            transition: opacity 0.5s;
        }

        .mixer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .channel {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .label {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
        }

        /* Minimalist Sliders styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* The Track (Thin black line) */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            cursor: pointer;
            background: #000;
        }

        /* The Thumb (Small black circle to match your clock center dot) */
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px; /* Centers the thumb on the 1px track */
        }
        
        /* Firefox fallbacks for sliders */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 1px;
            cursor: pointer;
            background: #000;
        }
        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Tinnitus Calmer</h1>

    <!-- Browsers require user interaction before playing audio -->
    <button id="powerBtn">Start Audio Engine</button>

    <div class="mixer" id="mixerUI">
        <!-- White Noise -->
        <div class="channel">
            <div class="label">
                <span>White Noise</span>
                <span id="valWhite">0%</span>
            </div>
            <input type="range" id="sliderWhite" min="0" max="100" value="0">
        </div>

        <!-- Brown Noise -->
        <div class="channel">
            <div class="label">
                <span>Brown Noise</span>
                <span id="valBrown">0%</span>
            </div>
            <input type="range" id="sliderBrown" min="0" max="100" value="0">
        </div>

        <!-- Custom WAV Placeholder 1 -->
        <div class="channel">
            <div class="label">
                <span>Crickets (.wav)</span>
                <span id="valCustom1">0%</span>
            </div>
            <input type="range" id="sliderCustom1" min="0" max="100" value="0">
            <!-- Hidden Audio Element -->
            <audio id="audioCustom1" src="sounds/crickets.wav" loop></audio>
        </div>

        <!-- Custom WAV Placeholder 2 -->
        <div class="channel">
            <div class="label">
                <span>Rain (.wav)</span>
                <span id="valCustom2">0%</span>
            </div>
            <input type="range" id="sliderCustom2" min="0" max="100" value="0">
            <!-- Hidden Audio Element -->
            <audio id="audioCustom2" src="sounds/rain.wav" loop></audio>
        </div>
    </div>

    <script>
        let audioCtx;
        let isPlaying = false;

        // Gain Nodes (Volume controllers)
        let whiteGain, brownGain;

        function initAudio() {
            // Setup Audio Context
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // ----------------------------------------------------
            // 1. Generate White Noise (Hissing sound, like a fan)
            // ----------------------------------------------------
            const bufferSize = audioCtx.sampleRate * 2; // 2 seconds of loop
            const whiteBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const whiteData = whiteBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                whiteData[i] = Math.random() * 2 - 1;
            }
            const whiteSource = audioCtx.createBufferSource();
            whiteSource.buffer = whiteBuffer;
            whiteSource.loop = true;

            whiteGain = audioCtx.createGain();
            whiteGain.gain.value = 0; // Start at 0 volume
            whiteSource.connect(whiteGain).connect(audioCtx.destination);
            whiteSource.start();

            // ----------------------------------------------------
            // 2. Generate Brown Noise (Deep rumbling, like a waterfall)
            // ----------------------------------------------------
            const brownBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const brownData = brownBuffer.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                // Integrate white noise to create brown noise drop-off
                brownData[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = brownData[i];
                brownData[i] *= 3.5; // Compensate for volume drop
            }
            const brownSource = audioCtx.createBufferSource();
            brownSource.buffer = brownBuffer;
            brownSource.loop = true;

            brownGain = audioCtx.createGain();
            brownGain.gain.value = 0;
            brownSource.connect(brownGain).connect(audioCtx.destination);
            brownSource.start();
            
            // ----------------------------------------------------
            // 3. Start custom HTML5 Audio tracks
            // ----------------------------------------------------
            const custom1 = document.getElementById('audioCustom1');
            const custom2 = document.getElementById('audioCustom2');
            
            custom1.volume = document.getElementById('sliderCustom1').value / 100;
            custom2.volume = document.getElementById('sliderCustom2').value / 100;
            
            // We use .catch() to silently ignore errors if you haven't added the .wav files yet
            custom1.play().catch(e => console.log("Missing sounds/crickets.wav"));
            custom2.play().catch(e => console.log("Missing sounds/rain.wav"));
        }

        // Power Button Logic
        const powerBtn = document.getElementById('powerBtn');
        const mixerUI = document.getElementById('mixerUI');

        powerBtn.addEventListener('click', () => {
            if (!isPlaying) {
                initAudio();
                isPlaying = true;
                powerBtn.textContent = "Stop Audio Engine";
                powerBtn.classList.add('active');
                mixerUI.classList.add('active');
            } else {
                audioCtx.close();
                document.getElementById('audioCustom1').pause();
                document.getElementById('audioCustom2').pause();
                isPlaying = false;
                powerBtn.textContent = "Start Audio Engine";
                powerBtn.classList.remove('active');
                mixerUI.classList.remove('active');
            }
        });

        // ----------------------------------------------------
        // Slider Logic
        // ----------------------------------------------------
        
        // Helper to map slider value (0-100) to an audio curve
        // Math.pow(val, 2) makes the volume slider feel natural to human ears
        function setVolume(gainNode, sliderValue) {
            if(gainNode) {
                gainNode.gain.value = Math.pow(sliderValue / 100, 2);
            }
        }

        // Synthesized Noise Sliders
        document.getElementById('sliderWhite').addEventListener('input', (e) => {
            document.getElementById('valWhite').textContent = e.target.value + '%';
            if(isPlaying) setVolume(whiteGain, e.target.value);
        });

        document.getElementById('sliderBrown').addEventListener('input', (e) => {
            document.getElementById('valBrown').textContent = e.target.value + '%';
            if(isPlaying) setVolume(brownGain, e.target.value);
        });

        // Custom WAV file sliders
        document.getElementById('sliderCustom1').addEventListener('input', (e) => {
            document.getElementById('valCustom1').textContent = e.target.value + '%';
            document.getElementById('audioCustom1').volume = Math.pow(e.target.value / 100, 2);
        });

        document.getElementById('sliderCustom2').addEventListener('input', (e) => {
            document.getElementById('valCustom2').textContent = e.target.value + '%';
            document.getElementById('audioCustom2').volume = Math.pow(e.target.value / 100, 2);
        });
    </script>
</body>
</html>
